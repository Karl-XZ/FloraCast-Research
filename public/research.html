<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FloraCast Research · 花序科研</title><link rel="stylesheet" href="research.css"><link rel="stylesheet" href="research-map.css"><link href="https://cdn.jsdelivr.net/npm/cesium@1.136.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet"></head>
<body>
<a class="skip" href="#workspace">跳到研究工作区</a>
<header class="topbar"><a class="brand" href="research.html"><span class="brand-mark">F</span><span>FLORACAST <small>RESEARCH / 花序科研</small></span></a><span class="top-caption">全球生态与物候研究</span><a class="quiet notes-link" id="research-notes-link" href="research-notes.html">研究说明</a><a class="quiet earth-link" href="index.html">地球工具 ↗</a></header>
<div class="shell">
<aside class="sidebar"><p class="eyebrow">研究空间</p><nav aria-label="工作区导航"><button data-view="projects" aria-current="page">研究项目 <span>01</span></button><button data-view="map">研究地图 <span>02</span></button><button data-view="data">数据清单 <span>03</span></button><button data-view="experiments">实验结果 <span>04</span></button><button data-view="evidence">证据审查 <span>05</span></button><button data-view="report">报告与复现 <span>06</span></button><button data-view="runs">运行记录 <span>07</span></button></nav><div class="sidebar-bottom"><span class="status-dot"></span><span id="connection">连接研究服务…</span></div></aside>
<main id="workspace" tabindex="-1">
<div class="page-heading"><div><p class="eyebrow" id="view-kicker">RESEARCH PROJECTS</p><h1 id="view-title">研究项目</h1></div><button class="primary" id="new-project">创建研究</button></div>
<p id="notice" class="notice" role="status" hidden></p>
<section id="projects-view" class="view"><div class="intro"><div><p class="eyebrow">NEW RUN</p><h2>新建研究协议</h2><p>配置研究问题、圆形研究区、年份、数据模式和验证规则。</p><button id="start-project" class="primary">新建协议 →</button></div><div class="research-diagram" aria-label="研究执行阶段"><span>协议</span><i>↓</i><span>数据与计算</span><i>↓</i><span>审查与复现</span></div></div><div class="section-heading"><h2>最近运行</h2><button class="quiet" id="refresh">刷新</button></div><div id="project-list" class="project-list"></div></section>
<section id="detail-view" class="view" hidden><div class="run-banner"><div><p class="eyebrow" id="run-id"></p><h2 id="run-question"></h2><p id="run-scope"></p></div><span class="badge" id="run-status"></span></div><div id="run-actions" class="actions"><button id="pause-run" class="quiet" hidden>暂停运行</button><button id="resume-run" class="quiet" hidden>继续运行</button><button id="cancel-run" class="quiet" hidden>取消运行</button><button id="compare-run" class="quiet" disabled>比较研究</button><button id="reproduce-run" class="primary" disabled>冻结快照复算</button><a id="export-run" class="button quiet">导出研究包</a><a id="export-notebook" class="button quiet">导出 Notebook</a></div><div id="detail-content"></div></section>
</main>
</div>
<dialog id="protocol-dialog"><form id="protocol-form"><div class="dialog-heading"><div><p class="eyebrow">NEW RESEARCH</p><h2>研究协议</h2></div><button type="button" id="close-dialog" class="quiet" aria-label="关闭创建研究">×</button></div><label>研究问题<textarea name="question" rows="3" minlength="12" required>研究该区域的春季植被指数变化及其气候背景，哪些结论受到数据支持？</textarea></label><div class="form-grid"><label>研究区名称<input name="locationName" value="青岛沿海研究区" required></label><label>数据模式<select name="mode"><option value="live">实时公开数据</option><option value="demo">固定测试数据</option></select></label><label>纬度<input name="lat" type="number" step="any" min="-90" max="90" value="36.0671" required></label><label>经度<input name="lng" type="number" step="any" min="-180" max="180" value="120.3826" required></label><label>开始年份<input name="startYear" type="number" min="1981" max="2026" value="2024" required></label><label>结束年份<input name="endYear" type="number" min="1981" max="2026" value="2024" required></label></div><label>圆形研究区半径（km）<input name="radiusKm" type="number" min="1" max="25" value="25" required></label><p class="helper">MODIS 250 m 像元：圆形掩膜、可靠性筛选、AOI 均值。物候方法：平滑阈值法、双逻辑拟合。地面观测可在实验结果页导入。</p><p id="form-error" class="error" role="alert" hidden></p><button class="primary" type="submit" id="submit-protocol">冻结协议并运行</button></form></dialog>
<script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.136.0/Build/Cesium/'</script><script src="https://cdn.jsdelivr.net/npm/cesium@1.136.0/Build/Cesium/Cesium.js"></script><script src="leaflet-compat-cesium.js"></script><script type="module" src="research.js"></script>
</body></html>
